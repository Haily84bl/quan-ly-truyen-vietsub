<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý truyện Vietsub</title><style>body{font:16px system-ui;background:#f5f6fa;color:#172033;margin:0}main{max-width:850px;margin:auto;padding:20px}header{background:#202b4a;color:white;padding:22px;border-radius:16px}h1{margin:0 0 8px;font-size:26px}button,input{font:inherit;padding:11px;border-radius:9px;border:1px solid #cbd2df}button{background:#285ce6;color:white;border:0;cursor:pointer}button.alt{background:#e8ecf6;color:#24304b}.card{background:white;padding:18px;margin:15px 0;border-radius:14px;box-shadow:0 2px 12px #17203312}.flex{display:flex;gap:10px;flex-wrap:wrap}.flex input{flex:1;min-width:130px}label{display:block;padding:8px 0}progress{width:100%;height:14px}small{color:#647084}.item{border-top:1px solid #e9edf4;padding:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;accent-color:#285ce6}.muted{color:#69738a}.hidden{display:none}</style></head><body><main><header><h1>📚 Quản lý truyện Vietsub</h1><div>Theo dõi từng truyện • Vietsub 5 phút/đoạn • 5 Shorts • Thumbnail • YouTube</div></header><section class="card"><h2>Tạo dự án truyện</h2><form id="form" class="flex"><input id="name" placeholder="Tên truyện" required><input id="minutes" type="number" min="1" step="1" placeholder="Thời lượng (phút)" required><button>+ Tạo truyện</button></form></section><section class="card"><div class="row"><h2>Dự án của tôi</h2><span id="count"></span></div><div id="projects"></div></section><section class="card"><h2>Sao lưu dữ liệu</h2><p><small>Dữ liệu tự lưu trên trình duyệt thiết bị này. Hãy xuất bản sao lưu định kỳ; nếu xóa dữ liệu Safari hoặc đổi thiết bị, dữ liệu có thể mất.</small></p><div class="flex"><button id="export" type="button">⬇ Xuất bản sao lưu JSON</button><label class="alt" style="padding:11px;background:#e8ecf6;border-radius:9px;cursor:pointer">⬆ Nhập bản sao lưu<input id="import" type="file" accept=".json,application/json" hidden></label></div></section></main><script>
const KEY='vietsub_projects_v1';let projects=[];try{projects=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(projects))projects=[]}catch(e){projects=[]}const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem(KEY,JSON.stringify(projects));render()};const fmt=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');function make(tag,text){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el}function check(label,value,callback){let row=make('label');let cb=make('input');cb.type='checkbox';cb.checked=!!value;cb.onchange=()=>callback(cb.checked);row.append(cb,document.createTextNode(' '+label));return row}function render(){let host=$('projects');host.replaceChildren();$('count').textContent=projects.length+' truyện';if(!projects.length)host.append(make('p','Chưa có dự án nào. Hãy tạo truyện đầu tiên.'));projects.forEach(p=>{let card=make('article');card.className='item';let top=make('div');top.className='row';let title=make('h3',p.name+' ('+p.minutes+' phút)');let del=make('button','Xóa');del.className='alt';del.onclick=()=>{if(confirm('Xóa dự án "'+p.name+'"?')){projects=projects.filter(x=>x.id!==p.id);save()}};top.append(title,del);card.append(top);let total=p.segments.length+7;let done=p.segments.filter(Boolean).length+p.shorts.filter(Boolean).length+Number(p.thumb)+Number(p.upload);card.append(make('small',done+'/'+total+' công việc — '+Math.round(done/total*100)+'% hoàn thành'));let bar=make('progress');bar.max=total;bar.value=done;card.append(bar);let details=make('details');let summary=make('summary','Mở danh sách công việc');details.append(summary,make('h4','Vietsub theo đoạn'));p.segments.forEach((v,i)=>{let start=i*5,end=Math.min((i+1)*5,p.minutes);details.append(check('Đoạn '+(i+1)+' · '+fmt(start)+' – '+fmt(end),v,val=>{p.segments[i]=val;save()}))});details.append(make('h4','5 video Shorts'));p.shorts.forEach((v,i)=>details.append(check('Short '+(i+1),v,val=>{p.shorts[i]=val;save()})));details.append(make('h4','Xuất bản'));details.append(check('Thiết kế thumbnail',p.thumb,val=>{p.thumb=val;save()}),check('Đăng video YouTube',p.upload,val=>{p.upload=val;save()}));card.append(details);host.append(card)})} $('form').onsubmit=e=>{e.preventDefault();let name=$('name').value.trim(),minutes=Number($('minutes').value);if(!name||!Number.isInteger(minutes)||minutes<1||minutes>10000)return alert('Nhập tên và số phút hợp lệ.');projects.unshift({id:Date.now()+'-'+Math.random(),name,minutes,segments:Array(Math.ceil(minutes/5)).fill(false),shorts:Array(5).fill(false),thumb:false,upload:false});$('form').reset();save()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,projects},null,2)],{type:'application/json'});let a=make('a');a.href=URL.createObjectURL(blob);a.download='sao_luu_truyen_vietsub.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.projects)||!data.projects.every(p=>typeof p.name==='string'&&Number.isInteger(p.minutes)&&p.minutes>0&&Array.isArray(p.segments)&&p.segments.length===Math.ceil(p.minutes/5)&&Array.isArray(p.shorts)&&p.shorts.length===5))throw Error('Sai định dạng');if(confirm('Thay thế toàn bộ danh sách hiện tại bằng bản sao lưu?')){projects=data.projects;save()}}catch(err){alert('Không đọc được bản sao lưu hợp lệ.')}e.target.value=''};render();
</script></body></html>
